name: Release App

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Sync App Version from Tag
        run: node scripts/sync-version.js ${{ github.ref_name }}

      - name: Prepare Paldex API Data & Assets
        run: node scripts/prepare-paldex.js

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Palworld Server Monitor ${{ github.ref_name }}'
          releaseBody: 'Automated release for Palworld Server Monitor ${{ github.ref_name }}. Includes offline Paldex compendium.'
          releaseDraft: false
          prerelease: false
